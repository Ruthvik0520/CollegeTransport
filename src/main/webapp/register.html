<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>
    <h1>Student Registration</h1>
</header>

<div class="container">

<div class="card">

<form action="StudentRegisterServlet" method="post">

    <input type="text"
           name="name"
           placeholder="Full Name"
           required>

    <br><br>

    <input type="text"
           name="roll_no"
           placeholder="Roll Number"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone Number"
           required>

    <br><br>

    <input type="text"
           name="department"
           placeholder="Department"
           required>

    <br><br>

    <input type="number"
           name="year"
           placeholder="Year"
           min="1"
           max="4"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit" class="btn">
        Register
    </button>

</form>

</div>

</div>

</body>
</html>
